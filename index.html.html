<style>
:root{--navy:#0f1f3d;--ink:#1b2a47;--bg:#f2f4f8;--card:#fff;--line:#dde2ec;--acc:#c8872b;--mut:#66728a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--card);border-radius:16px;padding:28px;box-shadow:0 4px 24px rgba(15,31,61,.08);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:2rem;line-height:1.2;margin:0 0 8px;color:var(--navy)}
h2{color:var(--navy);margin:28px 0 10px}
.sub{color:var(--mut)}
.hero{background:var(--navy);color:#fff}.hero h1{color:#fff}.hero .sub{color:#b9c3d9}
.stats{display:flex;gap:12px;margin:20px 0}
.stat{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--acc)}
.btn{border:0;border-radius:12px;padding:14px 26px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s}
.pri{background:var(--acc);color:#fff}.pri:hover{filter:brightness(1.08)}
.sec{background:#e8ecf4;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.bar{height:8px;background:#e3e8f1;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .5s}
.q{font-size:1.25rem;font-weight:600;margin:22px 0 16px;color:var(--navy)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:#9fb0cf;transform:translateX(2px)}
.opt.sel{border-color:var(--acc);background:#fdf5e8}
.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.big{font-size:2.4rem;font-weight:800;color:var(--acc);margin:0}
.row{margin:12px 0}
.row .l{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:4px}
.row .bar{height:12px}.row.first .bar>i{background:var(--acc)}.row .bar>i{background:#4f6a9c}
.note{background:#eef2f9;border-left:4px solid var(--acc);padding:12px 16px;border-radius:8px;margin:16px 0}
.ex{font-size:.92rem;color:var(--mut);margin:2px 0 0}
.dim{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.dim h4{margin:0 0 6px;color:var(--navy)}
.mini{display:grid;grid-template-columns:150px 1fr 42px;gap:8px;align-items:center;font-size:.85rem;margin:3px 0}
.mini .bar{height:7px}.mini .bar>i{background:#4f6a9c}
select{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hide{display:none}
@media(max-width:520px){.card{padding:20px}h1{font-size:1.6rem}.mini{grid-template-columns:110px 1fr 38px}}
</style>
</head>

Q('prosp','¿Cuál afirmación representa mejor tu creencia sobre la prosperidad material?',[
['Dios desea normalmente que sus hijos prosperen económicamente como parte de sus bendiciones.','00001500'],
['La fe y la generosidad pueden relacionarse con bendiciones materiales, aunque no garantizan riqueza.','00003400'],
['La prosperidad económica no es una señal necesaria de la bendición de Dios.','44444144'],
['La riqueza o pobreza no determinan la relación de una persona con Dios.','33333033']]),
Q('dones','¿Qué relación existe entre fe y sanidad física?',[
['Dios quiere sanar y la fe puede ser un medio para recibir sanidad.','00004500'],
['Dios puede sanar milagrosamente, pero no garantiza que toda persona será sanada en esta vida.','33334303'],
['La sanidad no es necesariamente una señal de fe verdadera.','04432122']]),
// BLOQUE 18 — Identidad (NO puntúa)
{d:'id',t:'¿Con cuál tradición o perfil te identificas actualmente?',o:[
['Católico romano'],['Reformado / calvinista'],['Bautista'],['Arminiano'],['Pentecostal'],
['Carismático / prosperidad'],['Testigo de Jehová'],['Adventista del Séptimo Día'],['Otra'],['Ninguna']],noscore:true}
];
// Se añade «No estoy seguro» (0 puntos) a cada pregunta puntuable.
QS.forEach(q=>{q.o=q.o.map(x=>({t:x[0],m:(x[1]||'').padEnd(8,'0').slice(0,8).split('').map(Number)}));
 if(!q.noscore)q.o.push({t:'No estoy seguro.',m:[0,0,0,0,0,0,0,0]});});
const N=QS.length; // 50 (49 doctrinales + 1 de identidad que NO puntúa)
const CONF=['Nada seguro','Poco seguro','Medianamente seguro','Muy seguro','Totalmente seguro'];

/* ========= ESTADO ========= */
let ans=new Array(N).fill(null),cur=-1,conf=null;
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ========= CÁLCULO ========= */
function compute(){
 const raw=Array(8).fill(0),max=Array(8).fill(0);
 const dRaw={},dMax={};
 QS.forEach((q,i)=>{
  if(q.noscore)return;
  const mx=Array(8).fill(0);q.o.forEach(o=>o.m.forEach((v,p)=>{if(v>mx[p])mx[p]=v;}));
  const sel=ans[i]!==null?q.o[ans[i]].m:Array(8).fill(0);
  dRaw[q.d]=dRaw[q.d]||Array(8).fill(0);dMax[q.d]=dMax[q.d]||Array(8).fill(0);
  for(let p=0;p<8;p++){raw[p]+=sel[p];max[p]+=mx[p];dRaw[q.d][p]+=sel[p];dMax[q.d][p]+=mx[p];}
 });
 const pct=(a,b)=>b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0;
 const res=PROF.map((p,i)=>({...p,i,pct:pct(raw[i],max[i])})).sort((a,b)=>b.pct-a.pct);
 const dims={};Object.keys(dRaw).forEach(d=>{dims[d]=PROF.map((p,i)=>({n:p.n,pct:pct(dRaw[d][i],dMax[d][i]),has:dMax[d][i]>0})).filter(x=>x.has).sort((a,b)=>b.pct-a.pct).slice(0,3);});
 return{res,dims};
}

/* ========= VISTAS ========= */
function start(){
 app.innerHTML=`<div class="card hero"><h1>Test de Afinidad Doctrinal Cristiana</h1>
 <p class="sub">50 preguntas para comparar tus convicciones con diferentes perfiles y tradiciones doctrinales.</p>
 <p>Este cuestionario mide afinidad doctrinal. No determina oficialmente tu religión, denominación o identidad cristiana.</p>
 <div class="stats"><div class="stat"><b>8</b>perfiles doctrinales</div><div class="stat"><b>50</b>preguntas</div></div>
 <p class="sub" style="font-size:.9rem">Privacidad: todo se calcula en tu navegador. No se recopilan ni envían datos.</p>
 <button class="btn pri" id="go">Comenzar</button></div>`;
 document.getElementById('go').onclick=()=>{cur=0;question();};
}
function question(){
 const q=QS[cur],pr=Math.round((cur+1)/N*100),last=cur===N-1;
 app.innerHTML=`<div class="card"><div class="top"><span>Pregunta ${cur+1} de ${N}</span><span>${pr}%</span></div>
 <div class="bar"><i style="width:${pr}%"></i></div>
 <div class="q">${esc(q.t)}</div>
 ${q.o.map((o,i)=>`<button class="opt ${ans[cur]===i?'sel':''}" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o.t)}</button>`).join('')}
 <div class="nav"><button class="btn sec" id="prev" ${cur===0?'disabled':''}>Anterior</button>
 <button class="btn pri" id="next" ${ans[cur]===null?'disabled':''}>${last?'Ver mis resultados':'Siguiente'}</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;question();});
 document.getElementById('prev').onclick=()=>{cur--;question();};
 document.getElementById('next').onclick=()=>{if(ans[cur]===null)return;if(last)results();else{cur++;question();}};
 window.scrollTo({top:0,behavior:'smooth'});
}
function results(){
 const{res,dims}=compute(),top=res[0],close=res[0].pct-res[1].pct<6;
 const idQ=QS[N-1],idTxt=idQ.o[ans[N-1]].t;
 const msg=close?'Tu resultado muestra afinidades cercanas entre varios perfiles. Esto significa que tus respuestas combinan elementos presentes en más de una tradición.':'Tu mayor afinidad aparece con este perfil.';
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">TU MAYOR AFINIDAD DOCTRINAL</h2>
 <h1>${top.n}</h1><p class="big">${top.pct}%</p>
 <p>${EXPL[top.k]}</p><div class="note">${msg} Este resultado no demuestra tu identidad religiosa; mide similitud de convicciones con perfiles generales.</div>
 <h2>COMPARACIÓN COMPLETA</h2>
 ${res.map((r,i)=>`<div class="row ${i?'':'first'}"><div class="l"><span>${r.n}</span><span>${r.pct}%</span></div><div class="bar"><i style="width:${r.pct}%"></i></div></div>`).join('')}
 <p class="ex">Los porcentajes son afinidades independientes (no suman 100%): varios perfiles comparten posiciones.</p>
 <h2>EXPLICACIÓN POR PERFIL</h2>
 ${res.map(r=>`<p><b>${r.n} (${r.pct}%).</b> ${EXPL[r.k]}</p>`).join('')}
 <h2>TUS ÁREAS DOCTRINALES</h2>
 <p class="ex">En cada área, los perfiles con los que tus respuestas coinciden más.</p>
 ${Object.keys(DIMS).filter(d=>dims[d]).map(d=>`<div class="dim"><h4>${DIMS[d]}</h4>${dims[d].map(x=>`<div class="mini"><span>${x.n.replace(' (perfil teológico)','')}</span><div class="bar"><i style="width:${x.pct}%"></i></div><span>${x.pct}%</span></div>`).join('')}</div>`).join('')}
 <h2>IDENTIDAD DECLARADA</h2>
 <p><b>Perfil/tradición con la que actualmente te identificas:</b> ${esc(idTxt)}</p>
 <p class="ex">Este dato no fue utilizado para calcular tus porcentajes.</p>
 <h2>CONFIANZA</h2>
 <p>¿Qué tan seguro estás de las respuestas que proporcionaste?</p>
 <select id="conf"><option value="">Selecciona…</option>${CONF.map((c,i)=>`<option value="${i}" ${conf===i?'selected':''}>${String.fromCharCode(65+i)}. ${c}</option>`).join('')}</select>
 <p class="ex">La confianza tampoco modifica las puntuaciones.</p>
 <div class="acts"><button class="btn pri" id="share">Compartir resultado</button>
 <button class="btn sec" id="back">Revisar respuestas</button>
 <button class="btn sec" id="again">Realizar el test nuevamente</button></div>
 <p class="ex" id="msg"></p></div>`;
 document.getElementById('conf').onchange=e=>{conf=e.target.value===''?null:+e.target.value;};
 document.getElementById('back').onclick=()=>{cur=N-1;question();};
 document.getElementById('again').onclick=()=>{ans=new Array(N).fill(null);conf=null;cur=-1;start();window.scrollTo(0,0);};
 const text=`Realicé el Test de Afinidad Doctrinal Cristiana. Mi mayor afinidad doctrinal fue ${top.n} con ${top.pct}%.`;
 const btn=document.getElementById('share'),msgEl=document.getElementById('msg');
 if(!navigator.share)btn.textContent='Copiar resultado';
 btn.onclick=async()=>{
  try{
   if(navigator.share){await navigator.share({title:'Test de Afinidad Doctrinal Cristiana',text});}
   else{await navigator.clipboard.writeText(text);msgEl.textContent='Resultado copiado al portapapeles.';}
  }catch(e){
   const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();
   try{document.execCommand('copy');msgEl.textContent='Resultado copiado al portapapeles.';}catch(_){msgEl.textContent=text;}
   t.remove();
  }
 };
 window.scrollTo({top:0,behavior:'smooth'});
}
start();
</script>
</body>
</html>
